<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>YanbaruQuest</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101a14; overflow: hidden; touch-action: none; }
    #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #unity-container { height: 100%; aspect-ratio: 9 / 16; max-width: 100%; position: relative; }
    #unity-canvas { width: 100%; height: 100%; background: #1d2b22; display: block; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #e8f0e8; font-family: sans-serif; background: #1d2b22; }
    #bar { width: 60%; height: 10px; background: #34493b; border-radius: 5px; margin-top: 16px; overflow: hidden; }
    #fill { width: 0%; height: 100%; background: #6fcf7f; }
    #note { margin-top: 18px; font-size: 13px; opacity: .7; text-align: center; padding: 0 20px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading"><div>歩いて隠れて！ヤンバルクイナ！！</div><div id="bar"><div id="fill"></div></div><div id="note">読み込み中…（はじめは少し時間がかかります）<br>縦向きでお楽しみください</div></div>
    </div>
  </div>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/Web.data?v=202611190201",
      frameworkUrl: buildUrl + "/Web.framework.js?v=202611190201",
      codeUrl: buildUrl + "/Web.wasm?v=202611190201",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "YanbaruQuest",
      productVersion: "202611190201",
      devicePixelRatio: 1,
    };
    var script = document.createElement("script");
    script.src = buildUrl + "/Web.loader.js?v=202611190201";
    script.onload = function () {
      createUnityInstance(document.querySelector("#unity-canvas"), config, function (p) {
        document.getElementById("fill").style.width = (p * 100) + "%";
      }).then(function () {
        document.getElementById("loading").style.display = "none";
      }).catch(function (m) {
        document.getElementById("note").textContent = "読み込みに失敗しました: " + m;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
